<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillStep - Personalized Learning, One Step at a Time</title>
    <meta
      name="description"
      content="SkillStep helps students take control of their online learning experience by delivering courses at a pace that suits them. Avoid content overload and stay motivated!"
    />
    <meta
      name="keywords"
      content="SkillStep, online learning, structured learning, YouTube API, course scheduling, educational platform, personalized learning"
    />
    <meta name="author" content="Rahil Ahmed Samani" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://skillstep.vercel.app/" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="./favicon.png" type="image/x-icon" />
    <link rel="preload" as="image" href="./favicon.png" />

    <!-- Open Graph Meta Tags (For Social Media Sharing) -->
    <meta
      property="og:title"
      content="SkillStep - Personalized Learning, One Step at a Time"
    />
    <meta
      property="og:description"
      content="Take control of your learning pace with SkillStep. No more content overload—just structured learning!"
    />
    <meta
      property="og:image"
      content="https://github.com/Rahilsamani/SkillStep/blob/main/src/assets/Logo/logo.jpeg?raw=true"
    />
    <meta property="og:url" content="https://skillstep.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card for Better Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SkillStep - Personalized Learning, One Step at a Time"
    />
    <meta
      name="twitter:description"
      content="SkillStep allows students to set their own course pace for an optimized learning experience."
    />
    <meta
      name="twitter:image"
      content="https://github.com/Rahilsamani/SkillStep/blob/main/src/assets/Logo/logo.jpeg?raw=true"
    />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SkillStep",
        "url": "https://skillstep.vercel.app/",
        "description": "SkillStep helps students take control of their online learning experience by delivering courses at a pace that suits them.",
        "author": {
          "@type": "Person",
          "name": "Rahil Ahmed Samani"
        },
        "image": "https://github.com/Rahilsamani/SkillStep/blob/main/src/assets/Logo/logo.jpeg?raw=true",
        "publisher": {
          "@type": "Organization",
          "name": "SkillStep"
        }
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
