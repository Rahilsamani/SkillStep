<!DOCTYPE html>
    <html>
    
    <head>
        <meta charset="UTF-8">
        <title>Notification</title>
        <style>
            body {
                background-color: #f9f9f9;
                font-family: 'Arial', sans-serif;
                font-size: 16px;
                line-height: 1.6;
                color: #333333;
                margin: 0;
                padding: 0;
            }
    
            .container {
                max-width: 600px;
                margin: 40px auto;
                padding: 20px;
                background-color: #ffffff;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
    
            .logo {
                max-width: 150px;
                margin: 20px auto;
                border-radius: 8px;
            }
    
            .title {
                font-size: 22px;
                font-weight: bold;
                color: #333333;
                margin-bottom: 20px;
                text-transform: uppercase;
            }
    
            .message {
                font-size: 16px;
                color: #555555;
                text-align: left;
                margin-bottom: 30px;
            }
    
            .cta {
                display: inline-block;
                padding: 12px 24px;
                background-color: #4CAF50;
                color: #ffffff;
                text-decoration: none;
                border-radius: 4px;
                font-size: 16px;
                font-weight: bold;
                transition: background-color 0.3s ease;
            }
    
            .cta:hover {
                background-color: #45a049;
            }
    
            .footer {
                font-size: 14px;
                color: #777777;
                margin-top: 30px;
            }
    
            .footer a {
                color: #4CAF50;
                text-decoration: none;
            }
    
            .footer a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    
    <body>
        <div class="container">
            <a href="https://SkillStep-edtech-project.vercel.app">
                <img class="logo" 
                     src="https://github.com/Rahilsamani/SkillStep/blob/main/src/assets/Logo/logo.jpeg?raw=true" 
                     alt="SkillStep Logo">
            </a>
            <div class="title">${notificationTitle}</div>
            <div class="message">
                <p>Dear ${recipientName},</p>
                <p>${notificationMessage}</p>
            </div>
            ${
              ctaLink && ctaText
                ? `<a href="${ctaLink}" class="cta">${ctaText}</a>`
                : ""
            }
            <div class="footer">
                <p>If you have any questions or need assistance, feel free to contact us at 
                   <a href="mailto:${supportEmail}">${supportEmail}</a>.</p>
                <p>Thank you, <br> The SkillStep Team</p>
            </div>
        </div>
    </body>
    
    </html>
